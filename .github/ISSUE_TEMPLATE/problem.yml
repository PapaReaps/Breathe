name: Something isn't working
description: Tell us about something in Breathe Money that didn't work as you expected.
title: "Problem: "
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. A rough description is plenty, and you can skip anything you're not sure about.

        **Please don't include your real numbers, passwords, PINs or backup passphrases.** Made-up numbers are perfect if you need an example.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see? A screenshot can help, as long as it doesn't show your real numbers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: How can we see it happen? (optional)
      description: For example, "Menu, then Coming up, then tap Month".
    validations:
      required: false
  - type: dropdown
    id: where
    attributes:
      label: Where were you using it?
      options:
        - The Android app
        - The website, on a phone
        - The website, on a computer
        - Not sure
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Which version? (optional)
      description: In the Android app, it's shown in Menu, Settings, App options, Updates.
      placeholder: "For example 0.18.0"
    validations:
      required: false
