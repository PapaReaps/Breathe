<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Breathe Money</title>
    <meta name="description" content="A calm, private way to see how much you can spend until your money comes in." />
    <meta name="theme-color" content="#1f5f5b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Before anything is drawn: use the light or dark choice from Settings, so the
      // opening screen never flashes the wrong colour. Only that one word is kept here.
      try {
        var theme = localStorage.getItem("breathe-appearance");
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
        if (theme === "black") {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.setAttribute("data-black", "");
        }
      } catch (e) {}
    </script>
    <link rel="preload" href="/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /*
       * The opening "deep breath" (branding idea 4d, docs/BRANDING.md): the word "breathe"
       * starts light, fills out and rises a little as it breathes in, holds, then settles,
       * with a soft shadow beneath it, like a chest rising and falling. About three seconds,
       * and only when the app starts fresh. With "reduce motion" it is the still word,
       * which fades away as soon as the app is ready.
       * The font (Nunito, SIL Open Font Licence) is inside the app: nothing is fetched from elsewhere.
       */
      @font-face {
        font-family: "Breathe Nunito";
        src: url("fonts/nunito.woff2") format("woff2");
        font-weight: 200 1000;
        font-display: block;
      }
      #splash {
        --splash-bg: #f6f5f1;
        --splash-ink: #1f5f5b;
        --splash-shadow: rgba(31, 95, 91, 0.22);
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: var(--splash-bg);
        transition: opacity 400ms ease-out;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #splash { --splash-bg: #151b1e; --splash-ink: #7cc4bd; --splash-shadow: rgba(124, 196, 189, 0.2); }
      }
      :root[data-theme="dark"] #splash { --splash-bg: #151b1e; --splash-ink: #7cc4bd; --splash-shadow: rgba(124, 196, 189, 0.2); }
      :root[data-black] #splash { --splash-bg: #000000; }
      #splash.splash-out { opacity: 0; pointer-events: none; }
      /* After the breath, the background softly clears and the word floats up to its place above the number. */
      #splash.splash-float { background-color: transparent; pointer-events: none; transition: background-color 1400ms ease-out; }
      .splash-mark { position: relative; font-size: clamp(56px, 17vw, 104px); }
      .splash-word {
        font-family: "Breathe Nunito", system-ui, sans-serif;
        font-weight: 200;
        line-height: 1;
        color: var(--splash-ink);
        opacity: 0;
        transform-origin: 50% 80%;
      }
      .splash-shadow {
        position: absolute;
        left: 50%;
        top: 100%;
        width: 3.2em;
        height: 0.28em;
        margin: 0.08em 0 0 -1.6em;
        border-radius: 50%;
        background: radial-gradient(closest-side, var(--splash-shadow), transparent);
        opacity: 0;
      }
      #splash.splash-go .splash-word { animation: splash-breathe 2600ms both; }
      #splash.splash-go .splash-shadow { animation: splash-chest 2600ms both; }
      /* In (1.3s), hold (0.26s), out (1.04s). Each step eases on its own, like a real breath. */
      @keyframes splash-breathe {
        0% { opacity: 0; font-weight: 200; letter-spacing: 0; transform: translateY(0.04em) scale(0.97, 0.95); animation-timing-function: ease-out; }
        8% { opacity: 1; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
        50% { opacity: 1; font-weight: 900; letter-spacing: 0.03em; transform: translateY(-0.06em) scale(1.02, 1.05); animation-timing-function: linear; }
        60% { opacity: 1; font-weight: 900; letter-spacing: 0.03em; transform: translateY(-0.06em) scale(1.02, 1.05); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
        100% { opacity: 1; font-weight: 200; letter-spacing: 0; transform: translateY(0.04em) scale(0.97, 0.95); }
      }
      @keyframes splash-chest {
        0% { opacity: 0; transform: scale(1); animation-timing-function: ease-out; }
        8% { opacity: 1; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
        50% { opacity: 0.55; transform: scale(0.82); animation-timing-function: linear; }
        60% { opacity: 0.55; transform: scale(0.82); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
        100% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash.splash-go .splash-word, #splash.splash-go .splash-shadow { animation: none; }
        .splash-word { opacity: 1; font-weight: 600; }
        .splash-shadow { display: none; }
        #splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-mark"><div class="splash-word">breathe</div><div class="splash-shadow"></div></div>
    </div>
    <div id="root"></div>
    <script>
      // The breath starts once its font is ready (so the letters never jump), then the app
      // calls window.breatheSplashDone() when it is ready to show. The breath always finishes
      // first, and the screen never stays longer than 6 seconds.
      (function () {
        var splash = document.getElementById("splash");
        var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var breath = calm ? 0 : 2600;
        var started = null;
        var appReady = false;
        var gone = false;
        var still = false;
        try { still = localStorage.getItem("breathe-still") === "1"; } catch (e) {}
        function fadeAway() {
          gone = true;
          splash.classList.add("splash-out");
          setTimeout(function () { splash.remove(); }, calm ? 0 : 420);
        }
        // The word floats up (4 seconds) to the "breathe" above the number, breathing as it goes
        // (one breath every 6 seconds), then hands over to it. A tap skips straight to the end.
        function floatUp(target) {
          gone = true;
          var root = document.documentElement;
          var word = splash.querySelector(".splash-word");
          var shadow = splash.querySelector(".splash-shadow");
          var welcome = !!document.querySelector('[data-screen="welcome"]');
          root.style.setProperty("--arrive-delay", welcome ? "2400ms" : "2000ms");
          root.style.setProperty("--arrive-ms", welcome ? "1600ms" : "1400ms");
          root.classList.add("breath-arriving");
          var FLOAT = 4000, BREATH = 6000;
          var settled = "translateY(0.04em) scale(0.97, 0.95)";
          word.style.animation = "none";
          word.style.opacity = "1";
          word.style.fontWeight = "200";
          word.style.transform = settled;
          var a = word.getBoundingClientRect();
          word.style.transform = "none";
          var plain = word.getBoundingClientRect();
          word.style.transform = settled;
          var b = target.getBoundingClientRect();
          var k = parseFloat(getComputedStyle(target).fontSize) / parseFloat(getComputedStyle(word).fontSize);
          var ox = plain.left + plain.width / 2, oy = plain.top + plain.height * 0.8;
          var cy = plain.top + plain.height / 2;
          var dx = b.left + b.width / 2 - ox;
          var dy = b.top + b.height / 2 - (oy + (cy - oy) * k);
          var ink = getComputedStyle(target).color;
          splash.classList.add("splash-float");
          var trip = word.animate(
            [{ transform: settled }, { transform: "translate(" + dx + "px, " + dy + "px) scale(" + k + ")", color: ink }],
            { duration: FLOAT, easing: "cubic-bezier(0.4, 0, 0.2, 1)", fill: "forwards" }
          );
          var loopStart = performance.now();
          var breathing = still ? null : word.animate(
            [{ fontWeight: 200, letterSpacing: "0em" }, { fontWeight: 600, letterSpacing: "0.02em", offset: 0.5 }, { fontWeight: 200, letterSpacing: "0em" }],
            { duration: BREATH, iterations: Infinity, easing: "ease-in-out" }
          );
          if (shadow) shadow.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, fill: "forwards" });
          var landed = false;
          function land() {
            if (landed) return;
            landed = true;
            window.removeEventListener("pointerdown", skip, true);
            if (breathing) target.style.animationDelay = -Math.round(performance.now() - loopStart) + "ms";
            root.classList.remove("breath-arriving");
            splash.remove();
          }
          function skip() { trip.finish(); land(); }
          trip.onfinish = land;
          window.addEventListener("pointerdown", skip, true);
          setTimeout(land, FLOAT + 1000);
        }
        function remove() {
          if (gone) return;
          var target = document.querySelector(".breath-mark");
          if (!calm && target && target.getClientRects().length > 0 && typeof Element.prototype.animate === "function") {
            try { floatUp(target); return; } catch (e) { document.documentElement.classList.remove("breath-arriving"); /* fall back to the plain fade */ }
          }
          fadeAway();
        }
        function maybeRemove() {
          if (!appReady || started === null) return;
          setTimeout(remove, Math.max(0, breath - (Date.now() - started)));
        }
        function go() {
          if (started !== null) return;
          started = Date.now();
          splash.classList.add("splash-go");
          maybeRemove();
        }
        try {
          document.fonts.load('200 1em "Breathe Nunito"').then(go, go);
        } catch (e) {
          go();
        }
        setTimeout(go, 800);
        window.breatheSplashDone = function () {
          appReady = true;
          maybeRemove();
        };
        setTimeout(remove, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
